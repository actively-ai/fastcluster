[build-system]
# NumPy 2 headers produce wheels that work with both NumPy 1 and 2.
# Building against oldest-supported-numpy produces a NumPy 1-only ABI.
requires = ["setuptools", "wheel",
            "numpy>=2,<3; python_version >= '3.9'",
            "oldest_supported_numpy; python_version < '3.9'"]
